name: Test and rehearse
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: node --test tests/frontend/state.test.cjs
      - run: python tools/validate_package.py
      - run: python run_demo.py
      - run: python run_workbench.py
      - run: python -m compileall -q rehearsal tests tools run_demo.py run_workbench.py serve_workbench.py
